version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hp_mysql
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    command: > 
      --default-authentication-plugin=mysql_native_password 
      --local-infile=1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_fresh:/var/lib/mysql
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mysql_network

  python_loader:
    image: python:3.12
    depends_on:
      - mysql
    volumes:
      - .:/app
    working_dir: /app
    command: >
      sh -c "pip install numpy pandas sqlalchemy pymysql && python upload_data.py"
    networks:
      - mysql_network

volumes:
  mysql_data_fresh:
    driver: local

networks:
  mysql_network:
    driver: bridge